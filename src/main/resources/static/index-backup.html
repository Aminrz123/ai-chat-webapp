<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #212121;
            color: #ececec;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top bar */
        .topbar {
            display: flex;
            align-items: center;
            padding: 14px 24px;
            background: #2f2f2f;
            border-bottom: 1px solid #3a3a3a;
            gap: 10px;
        }
        .topbar .logo {
            width: 32px; height: 32px;
            background: #10a37f;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 16px; color: white;
        }
        .topbar h1 { font-size: 17px; font-weight: 600; color: #ececec; }

        /* Messages */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 32px 0;
            display: flex;
            flex-direction: column;
            gap: 0;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

        .message-row {
            display: flex;
            padding: 12px 10%;
            gap: 16px;
            align-items: flex-start;
        }
        .message-row.user { justify-content: flex-end; }
        .message-row.bot { background: #2a2a2a; }

        .avatar {
            width: 32px; height: 32px;
            border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: bold;
            flex-shrink: 0;
        }
        .avatar.bot { background: #10a37f; color: white; }
        .avatar.user { background: #5563f3; color: white; }

        .message-content {
            max-width: 700px;
            font-size: 15px;
            line-height: 1.7;
            color: #ececec;
            padding-top: 4px;
        }

        .message-row.user .message-content {
            background: #3a3a3a;
            padding: 10px 16px;
            border-radius: 18px 18px 4px 18px;
        }

        /* Markdown styling */
        .message-content p { margin: 0 0 10px; }
        .message-content p:last-child { margin-bottom: 0; }
        .message-content ul, .message-content ol { margin: 6px 0 10px 20px; }
        .message-content li { margin: 4px 0; }
        .message-content strong { color: #fff; font-weight: 600; }
        .message-content h1, .message-content h2, .message-content h3 {
            margin: 14px 0 6px; color: #fff;
        }
        .message-content code {
            background: #383838; padding: 2px 6px;
            border-radius: 4px; font-size: 13px; color: #e8e8e8;
        }
        .message-content pre {
            background: #1e1e1e; padding: 14px;
            border-radius: 8px; overflow-x: auto; margin: 10px 0;
        }
        .message-content pre code { background: none; padding: 0; }

        /* Loading dots */
        .loading-dots span {
            display: inline-block;
            width: 6px; height: 6px;
            background: #10a37f;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.2s infinite;
        }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
            40% { transform: translateY(-6px); opacity: 1; }
        }

        /* Input area */
        .input-area {
            padding: 16px 10%;
            background: #212121;
            border-top: 1px solid #333;
        }

        .input-box {
            display: flex;
            background: #2f2f2f;
            border: 1px solid #444;
            border-radius: 12px;
            align-items: flex-end;
            padding: 10px 14px;
            gap: 10px;
            transition: border-color 0.2s;
        }
        .input-box:focus-within { border-color: #10a37f; }

        .input-box textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ececec;
            font-size: 15px;
            font-family: inherit;
            resize: none;
            max-height: 140px;
            line-height: 1.5;
            padding: 2px 0;
        }
        .input-box textarea::placeholder { color: #666; }

        .input-box button {
            background: #10a37f;
            border: none;
            color: white;
            width: 34px; height: 34px;
            border-radius: 8px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s;
        }
        .input-box button:hover { background: #0d8a6d; }
        .input-box button:disabled { background: #444; cursor: not-allowed; }

        .input-hint {
            text-align: center;
            font-size: 12px;
            color: #555;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="topbar">
    <div class="logo">AI</div>
    <h1>AI Chat</h1>
</div>

<div class="chat-messages" id="messages">
    <div class="message-row bot">
        <div class="avatar bot">AI</div>
        <div class="message-content">Hej! Hvordan kan jeg hjælpe dig i dag?</div>
    </div>
</div>

<div class="input-area">
    <div class="input-box">
        <textarea id="input" placeholder="Skriv en besked..." rows="1"
            oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
        <button id="sendBtn" onclick="sendMessage()" title="Send">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </div>
    <div class="input-hint">Tryk Enter for at sende · Shift+Enter for ny linje</div>
</div>

<script>
    async function sendMessage() {
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');
        const sendBtn = document.getElementById('sendBtn');
        const text = input.value.trim();
        if (!text) return;

        input.value = '';
        input.style.height = 'auto';
        sendBtn.disabled = true;

        // Bruger besked
        const userRow = document.createElement('div');
        userRow.className = 'message-row user';
        userRow.innerHTML = `
            <div class="message-content">${escapeHtml(text)}</div>
            <div class="avatar user">Du</div>
        `;
        messages.appendChild(userRow);
        messages.scrollTop = messages.scrollHeight;

        // Loading
        const botRow = document.createElement('div');
        botRow.className = 'message-row bot';
        botRow.innerHTML = `
            <div class="avatar bot">AI</div>
            <div class="message-content">
                <div class="loading-dots"><span></span><span></span><span></span></div>
            </div>
        `;
        messages.appendChild(botRow);
        messages.scrollTop = messages.scrollHeight;

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });
            const data = await res.json();
            botRow.querySelector('.message-content').innerHTML = marked.parse(data.reply);
        } catch (e) {
            botRow.querySelector('.message-content').textContent = 'Fejl: kunne ikke få svar.';
        }

        sendBtn.disabled = false;
        messages.scrollTop = messages.scrollHeight;
        input.focus();
    }

    function escapeHtml(text) {
        return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
</script>
</body>
</html>
